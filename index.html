<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fredagsquiz &middot; Svarsformulär</title>
  <meta name="description" content="Svarsformulär för Fredagsquiz.">
  <meta name="theme-color" content="#191919">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#10067;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="bg__blob bg__blob--brand"></span>
    <span class="bg__blob bg__blob--deep"></span>
    <span class="bg__blob bg__blob--amber"></span>
    <span class="bg__dots"></span>
  </div>

  <div class="lights" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">
      <span class="brand__glass" aria-hidden="true">&#10067;</span>
      <span class="brand__text">
        <span class="brand__name">Fredagsquiz</span>
      </span>
      <span class="brand__glass" aria-hidden="true">&#10067;</span>
    </div>
  </header>

  <main class="main">

    <!-- 1. Uppstart -->
    <section class="panel panel--setup" id="view-setup" aria-labelledby="setup-title">

      <form class="setup" id="setup-form">
        <div class="field">
          <label class="field__label" for="name">Namn</label>
          <input class="input" type="text" id="name" name="name" maxlength="40"
                 placeholder="t.ex. Anna" autocomplete="name" spellcheck="false" required>
        </div>

        <div class="field">
          <label class="field__label" id="game-code-label" for="game-code">Spelkod</label>
          <div class="game-code-row" id="game-code-row">
            <input class="input" type="text" id="game-code" name="game-code" maxlength="5"
                   placeholder="Skriv kod f&ouml;r att g&aring; med" autocomplete="off" spellcheck="false">
            <button class="btn btn--primary btn--lg" type="button" id="create-game">
              Skapa nytt spel
            </button>
            <button class="btn btn--primary btn--lg" type="button" id="join-game">
              G&aring; med
            </button>
          </div>
          <p class="field__hint" id="game-code-status" aria-live="polite"></p>
        </div>
        <div class="host-result" id="closed-game-result" hidden></div>

        <div id="game-settings" hidden>
          <div class="field" id="answer-count-field">
            <label class="field__label" for="answer-count">Antal svarsalternativ</label>
            <input class="input" type="number" id="answer-count" name="answer-count"
                   value="4" min="1" max="10" step="1" inputmode="numeric">
          </div>

          <div class="field">
            <label class="field__label" for="answer-design">Svarsdesign</label>
            <div class="select-wrap">
              <select class="input select-wrap__select" id="answer-design" name="answer-design">
                <option value="letters">A, B, C ...</option>
                <option value="numbers">1, 2, 3 ...</option>
                <option value="text">Fritext</option>
              </select>
            </div>
          </div>

          <label class="check-field" for="elimination-question">
            <input type="checkbox" id="elimination-question" name="elimination-question" checked>
            <span>Ha med utslagsfråga</span>
          </label>

          <div class="field field--count">
            <span class="field__label" id="count-label">Antal fr&aring;gor</span> 
            <div class="counter">
              <button class="counter__btn" type="button" id="count-minus" aria-label="Minska antal fr&aring;gor">&minus;</button>
              <input class="counter__value" type="text" inputmode="numeric" id="count" name="count"
                     value="10" aria-labelledby="count-label" aria-describedby="count-hint">
              <button class="counter__btn" type="button" id="count-plus" aria-label="&Ouml;ka antal fr&aring;gor">+</button>
            </div>
            <p class="field__hint" id="count-hint"></p>
            <div class="chips" role="group" aria-label="Snabbval antal fr&aring;gor">
              <button class="chip" type="button" data-count="5">5</button>
              <button class="chip" type="button" data-count="10">10</button>
              <button class="chip" type="button" data-count="15">15</button>
              <button class="chip" type="button" data-count="20">20</button>
              <button class="chip" type="button" data-count="25">25</button>
              <button class="chip" type="button" data-count="30">30</button>
              <button class="chip" type="button" data-count="50">50</button>
            </div>
          </div>
        </div>

        <div class="actions actions--wrap" id="start-actions" hidden>
          <button class="btn btn--ghost btn--lg" type="button" id="cancel-create">
            Avbryt
          </button>
          <button class="btn btn--primary btn--lg" type="submit">
            Starta
          </button>
        </div>
      </form>
    </section>

    <!-- 2. Värdvy -->
    <section class="panel panel--host" id="view-host" aria-labelledby="host-title" hidden>
      <div class="panel__intro">
        <p class="panel__eyebrow">Värd för spelet</p>
        <h2 class="panel__title" id="host-title">Dela spelkoden</h2>
      </div>

      <div class="host-code" aria-live="polite">
        <span class="host-code__label">Spelkod</span>
        <strong class="host-code__value" id="host-game-code">-----</strong>
      </div>

      <div class="actions actions--wrap host-actions">
        <button class="btn btn--primary btn--lg host-actions__copy" type="button" id="copy-game-code">Kopiera kod</button>
        <button class="btn btn--ghost btn--lg host-actions__end" type="button" id="end-game">Avsluta spel</button>
        <button class="btn btn--ghost btn--lg host-actions__new" type="button" id="host-new-game">Nytt spel</button>
      </div>

      <div class="host-result" id="host-result" hidden></div>
      <p class="summary__note host-status" id="host-status"></p>
    </section>

    <!-- 2. Svarsformulär -->
    <section class="panel panel--sheet" id="view-sheet" aria-labelledby="sheet-title" hidden>
      <h2 class="sr-only" id="sheet-title">Dina svar</h2>

      <div class="toolbar">
        <div class="toolbar__who">
          <span class="avatar" id="who-avatar" aria-hidden="true">?</span>
          <span class="toolbar__name" id="who-name">Deltagare</span>
        </div>

        <div class="toolbar__progress">
          <div class="progress" id="progress" role="progressbar" aria-label="Besvarade fr&aring;gor"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span class="progress__bar" id="progress-bar"></span>
          </div>
          <span class="toolbar__meta">
            <strong id="answered-count">0</strong> av <strong id="total-count">0</strong> besvarade
          </span>
        </div>

        <div class="toolbar__count">
          <span class="toolbar__countlabel">Fr&aring;gor</span>
          <div class="counter counter--sm">
            <button class="counter__btn" type="button" id="sheet-minus" aria-label="Minska antal fr&aring;gor">&minus;</button>
            <span class="counter__value counter__value--static" id="sheet-count">10</span>
            <button class="counter__btn" type="button" id="sheet-plus" aria-label="&Ouml;ka antal fr&aring;gor">+</button>
          </div>
        </div>
      </div>

      <div class="hintbar" id="answer-hint">
        <span class="hintbar__sep" aria-hidden="true">&middot;</span>
        <span>kryssa i med tangentbordet &ndash; <kbd>&uarr;</kbd><kbd>&darr;</kbd> byter fr&aring;ga</span>
      </div>

      <div class="alert" id="unanswered-alert" hidden>
        <p class="alert__text" id="unanswered-text"></p>
        <div class="alert__actions">
          <button class="btn btn--ghost btn--sm" type="button" id="jump-first">Hoppa till f&ouml;rsta</button>
          <button class="btn btn--ghost btn--sm" type="button" id="send-anyway">gå vidare &auml;ndå</button>
        </div>
      </div>

      <ol class="questions" id="questions"></ol>

      <div class="actions">
        <button class="btn btn--ghost" type="button" id="back-to-setup">&larr; Tillbaka</button>
        <button class="btn btn--primary btn--lg" type="button" id="submit-answers">
          Klar
          <span class="btn__arrow" aria-hidden="true">&rarr;</span>
        </button>
      </div>
    </section>

    <!-- 3. Sammanfattning -->
    <section class="panel panel--summary" id="view-summary" aria-labelledby="summary-title" hidden>
      <!-- <div class="summary__badge" aria-hidden="true">Bra jobbat!&#127881;</div> -->
      <h2 class="panel__title" id="summary-title">Bra jobbat!&#127881;</h2>
      
      <dl class="meta" id="summary-meta"></dl>

      <h3 class="summary__subtitle">Dina svar</h3>
      <p class="legend">
        <span class="legend__item legend__item--correct"><span class="legend__dot" aria-hidden="true">&#10003;</span>R&auml;tt</span>
        <span class="legend__item legend__item--wrong"><span class="legend__dot" aria-hidden="true">&#10007;</span>Fel</span>
        <span class="legend__item legend__item--none"><span class="legend__dot" aria-hidden="true">&middot;</span>Ej markerad</span>
      </p>
      <ol class="answergrid" id="answergrid"></ol>
      <ol class="answergrid elimination-summary" id="elimination-summary" hidden></ol>

    

      <div class="score">
        <label class="score__label" for="score">Antal r&auml;tt</label>
        <div class="score__field">
          <input class="score__input" type="text" inputmode="numeric" id="score" name="score"
               autocomplete="off" aria-describedby="score-hint" readonly>
          <span class="score__of">av <span id="score-max">0</span></span>
        </div>
      </div>

      <div class="actions actions--wrap">
        <button class="btn btn--ghost" type="button" id="edit-answers">Redigera svar</button>
        <button class="btn btn--primary" type="button" id="submit-score">Spara resultat</button>
        <button class="btn btn--quiet" type="button" id="restart">Nytt spel</button>
      </div>

      <p class="summary__note" id="summary-note"></p>
      <p class="summary__note" id="score-status"></p>
      <div class="host-result" id="player-result" hidden></div>
    </section>

  </main>

  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
